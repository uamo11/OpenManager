<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenManager</title>
<style>
:root{--bg:#121417;--panel:#1b1e23;--row:#20242a;--hover:#2a2f37;--text:#e8eaed;--dim:#9aa0a6;--accent:#4f8cff;--danger:#ff6b6b;--ok:#3ccf91}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid #2c3036;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;margin-right:6px}
header .dev{color:var(--dim);font-size:12px}
.crumbs{flex:1;min-width:200px;display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.crumbs a{color:var(--text);text-decoration:none;padding:4px 6px;border-radius:6px}
.crumbs a:hover{background:var(--hover)}
.crumbs span{color:var(--dim)}
button,.btn{background:#2a2f37;color:var(--text);border:1px solid #3a3f47;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
button:hover{background:#343a44}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
main{padding:12px 16px 80px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar input[type=search]{flex:1;min-width:160px;background:var(--panel);border:1px solid #3a3f47;color:var(--text);border-radius:8px;padding:7px 10px}
.space{color:var(--dim);font-size:12px;margin-left:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;padding:6px 8px;cursor:pointer;user-select:none}
td{padding:8px;border-top:1px solid #23272d;vertical-align:middle}
tr.item:hover td{background:var(--row)}
tr.sel td{background:#22314d!important}
td.name{width:100%;word-break:break-all}
td.name a{color:var(--text);text-decoration:none}
td.name a:hover{text-decoration:underline}
td.size,td.date{white-space:nowrap;color:var(--dim);font-size:12px}
td.act{white-space:nowrap}
td.act button{padding:4px 8px;font-size:12px}
.ico{display:inline-block;width:22px;text-align:center;margin-right:6px}
.empty{color:var(--dim);padding:40px;text-align:center}
#drop{position:fixed;inset:0;background:#4f8cff22;border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;z-index:5;pointer-events:none}
#uploads{position:fixed;right:16px;bottom:16px;width:320px;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:8px;z-index:6}
.up{background:var(--panel);border:1px solid #2c3036;border-radius:10px;padding:10px;font-size:12px}
.up .p{height:6px;background:#2a2f37;border-radius:3px;margin-top:6px;overflow:hidden}
.up .p div{height:100%;background:var(--accent);width:0}
.up.done .p div{background:var(--ok)}
.up.err{border-color:var(--danger)}
#preview{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:7}
#preview img,#preview video{max-width:94vw;max-height:90vh;border-radius:8px}
#preview .close{position:absolute;top:14px;right:18px}
@media (max-width:640px){td.date{display:none}}
</style>
</head>
<body>
<header>
  <span class="brand">📁 OpenManager</span><span class="dev" id="dev"></span>
  <nav class="crumbs" id="crumbs"></nav>
</header>
<main>
  <div class="bar">
    <button id="up" title="Up">⬆</button>
    <button id="refresh" data-t="refresh"></button>
    <button id="mkdir" data-t="newFolder"></button>
    <button id="upload" class="primary" data-t="upload"></button>
    <input id="files" type="file" multiple hidden>
    <button id="dlSel" data-t="download" disabled></button>
    <button id="rmSel" class="danger" data-t="delete" disabled></button>
    <input id="filter" type="search">
    <span class="space" id="space"></span>
  </div>
  <table>
    <thead><tr><th style="width:28px"><input type="checkbox" id="all"></th><th data-sort="n" data-t="name"></th><th data-sort="s" data-t="size"></th><th data-sort="m" data-t="modified"></th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  <div class="empty" id="empty" hidden></div>
</main>
<div id="drop"></div>
<div id="uploads"></div>
<div id="preview"><button class="close" id="pclose">✕</button><div id="pbody"></div></div>
<script>
(function(){
"use strict";
var es=(navigator.language||"").toLowerCase().indexOf("es")===0;
var T=es?{refresh:"Actualizar",newFolder:"Nueva carpeta",upload:"Subir archivos",download:"Descargar",delete:"Borrar",name:"Nombre",size:"Tamaño",modified:"Modificado",
filter:"Filtrar en esta carpeta",empty:"Carpeta vacía",drop:"Suelta los archivos para subirlos aquí",folderName:"Nombre de la carpeta",newName:"Nuevo nombre",
confirmRm:"¿Borrar {n} elemento(s)? No se puede deshacer.",exists:"Ya existe un archivo con ese nombre. ¿Reemplazarlo?",free:"{f} libres de {t}",rename:"Renombrar",
code:"El código ya no es válido. Vuelve a introducirlo.",failed:"Error: ",locked:"Acceso bloqueado por demasiados códigos incorrectos. Reinícialo en el móvil."}
:{refresh:"Refresh",newFolder:"New folder",upload:"Upload files",download:"Download",delete:"Delete",name:"Name",size:"Size",modified:"Modified",
filter:"Filter this folder",empty:"Empty folder",drop:"Drop files to upload them here",folderName:"Folder name",newName:"New name",
confirmRm:"Delete {n} item(s)? This cannot be undone.",exists:"A file with this name exists. Replace it?",free:"{f} free of {t}",rename:"Rename",
code:"The code is no longer valid. Enter it again.",failed:"Error: ",locked:"Access locked after too many wrong codes. Restart it on the phone."};
var params=new URLSearchParams(location.search);
var key=params.get("k")||sessionStorage.getItem("omk")||"";
if(params.get("k")){sessionStorage.setItem("omk",key);history.replaceState(null,"",location.pathname+location.hash);}
var path=decodeURIComponent((location.hash||"#/").slice(1))||"/";
var entries=[],sortKey="n",sortAsc=true,selected=new Set();
var $=function(id){return document.getElementById(id)};
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[e.getAttribute("data-t")]});
$("filter").placeholder=T.filter;$("drop").textContent=T.drop;
function q(o){var s=[];for(var k in o)s.push(encodeURIComponent(k)+"="+encodeURIComponent(o[k]));return s.join("&")}
function api(method,ep,params,body){
  return fetch("/api/"+ep+"?"+q(params),{method:method,headers:{"X-OM-Key":key},body:body}).then(function(r){
    if(r.status===401){alert(T.code);sessionStorage.removeItem("omk");location.href="/";throw new Error("code")}
    if(r.status===423){alert(T.locked);throw new Error("locked")}
    return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j});
  });
}
function join(dir,name){return (dir==="/"?"":dir)+"/"+name}
function fmtSize(b){if(b<1024)return b+" B";var u=["KB","MB","GB","TB"],i=-1;do{b/=1024;i++}while(b>=1024&&i<u.length-1);return b.toFixed(b<10?1:0)+" "+u[i]}
function fmtDate(ms){var d=new Date(ms);return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function icon(e){if(e.d)return "📁";var x=(e.n.split(".").pop()||"").toLowerCase();
  if(/^(jpg|jpeg|png|gif|webp|bmp|heic)$/.test(x))return "🖼️";if(/^(mp4|mkv|webm|mov|avi|3gp)$/.test(x))return "🎬";
  if(/^(mp3|m4a|flac|wav|ogg|opus|aac)$/.test(x))return "🎵";if(/^(zip|rar|7z|tar|gz|xz|apk|apks|xapk)$/.test(x))return x.indexOf("apk")===0?"🤖":"🗜️";
  if(/^(pdf)$/.test(x))return "📕";if(/^(txt|md|log|json|xml|html|js|kt|java|sh|py|c|cpp|h|smali)$/.test(x))return "📄";return "📦"}
function kind(n){var x=(n.split(".").pop()||"").toLowerCase();if(/^(jpg|jpeg|png|gif|webp|bmp)$/.test(x))return "img";if(/^(mp4|webm|mov|m4v)$/.test(x))return "video";if(/^(mp3|m4a|wav|ogg|opus|aac|flac)$/.test(x))return "audio";return ""}
function dlUrl(p,inline){return "/api/dl?"+q(inline?{p:p,k:key,inline:1}:{p:p,k:key})}
function load(){
  api("GET","ls",{p:path}).then(function(j){path=j.path;entries=j.entries;selected.clear();render()}).catch(function(e){if(e.message!=="code")alert(T.failed+e.message)});
  api("GET","info",{}).then(function(j){$("dev").textContent=j.device;$("space").textContent=T.free.replace("{f}",fmtSize(j.free)).replace("{t}",fmtSize(j.total))}).catch(function(){});
}
function crumbs(){
  var c=$("crumbs");c.innerHTML="";var parts=path.split("/").filter(Boolean),acc="";
  var a=document.createElement("a");a.href="#/";a.textContent="🏠";c.appendChild(a);
  parts.forEach(function(p){acc+="/"+p;var s=document.createElement("span");s.textContent="›";c.appendChild(s);
    var l=document.createElement("a");l.href="#"+encodeURIComponent(acc);l.textContent=p;c.appendChild(l)});
}
function render(){
  crumbs();var f=$("filter").value.toLowerCase();
  var list=entries.filter(function(e){return !f||e.n.toLowerCase().indexOf(f)>=0});
  list.sort(function(a,b){if(a.d!==b.d)return a.d?-1:1;var r=sortKey==="n"?a.n.localeCompare(b.n,undefined,{numeric:true,sensitivity:"base"}):a[sortKey]-b[sortKey];return sortAsc?r:-r});
  var tb=$("list");tb.innerHTML="";
  list.forEach(function(e){
    var p=join(path,e.n),tr=document.createElement("tr");tr.className="item"+(selected.has(e.n)?" sel":"");
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=selected.has(e.n);
    cb.onchange=function(){cb.checked?selected.add(e.n):selected.delete(e.n);tr.classList.toggle("sel",cb.checked);updateSel()};
    var td0=document.createElement("td");td0.appendChild(cb);tr.appendChild(td0);
    var tdn=document.createElement("td");tdn.className="name";var a=document.createElement("a");
    a.innerHTML='<span class="ico"></span>';a.firstChild.textContent=icon(e);a.appendChild(document.createTextNode(e.n));
    if(e.d){a.href="#"+encodeURIComponent(p)}else{a.href=dlUrl(p,false);var k=kind(e.n);if(k){a.onclick=function(ev){ev.preventDefault();preview(p,k)}}}
    tdn.appendChild(a);tr.appendChild(tdn);
    var ts=document.createElement("td");ts.className="size";ts.textContent=e.d?"":fmtSize(e.s);tr.appendChild(ts);
    var tdd=document.createElement("td");tdd.className="date";tdd.textContent=fmtDate(e.m);tr.appendChild(tdd);
    var ta=document.createElement("td");ta.className="act";
    var rn=document.createElement("button");rn.textContent="✏️";rn.title=T.rename;rn.onclick=function(){rename(e)};ta.appendChild(rn);
    if(!e.d){var dl=document.createElement("a");dl.className="btn";dl.textContent="⬇";dl.href=dlUrl(p,false);dl.style.marginLeft="4px";dl.style.padding="4px 8px";dl.style.textDecoration="none";ta.appendChild(dl)}
    tr.appendChild(ta);tb.appendChild(tr);
  });
  $("empty").hidden=list.length>0;$("empty").textContent=T.empty;$("up").disabled=path==="/";$("all").checked=false;updateSel();
}
function updateSel(){var n=selected.size;$("rmSel").disabled=n===0;$("dlSel").disabled=!Array.from(selected).some(function(s){var e=entries.find(function(x){return x.n===s});return e&&!e.d})}
function preview(p,k){var b=$("pbody");b.innerHTML="";var el=document.createElement(k==="img"?"img":k);el.src=dlUrl(p,true);if(k!=="img"){el.controls=true;el.autoplay=true}b.appendChild(el);$("preview").style.display="flex"}
$("pclose").onclick=function(){$("pbody").innerHTML="";$("preview").style.display="none"};
function rename(e){var n=prompt(T.newName,e.n);if(!n||n===e.n)return;api("POST","mv",{p:join(path,e.n),n:n}).then(load).catch(function(x){alert(T.failed+x.message)})}
$("mkdir").onclick=function(){var n=prompt(T.folderName);if(!n)return;api("POST","mkdir",{p:path,n:n}).then(load).catch(function(x){alert(T.failed+x.message)})};
$("rmSel").onclick=function(){var names=Array.from(selected);if(!names.length||!confirm(T.confirmRm.replace("{n}",names.length)))return;
  names.reduce(function(pr,n){return pr.then(function(){return api("POST","rm",{p:join(path,n)})})},Promise.resolve()).then(load).catch(function(x){alert(T.failed+x.message);load()})};
$("dlSel").onclick=function(){Array.from(selected).forEach(function(n,i){var e=entries.find(function(x){return x.n===n});if(!e||e.d)return;
  setTimeout(function(){var a=document.createElement("a");a.href=dlUrl(join(path,n),false);a.download=n;document.body.appendChild(a);a.click();a.remove()},i*400)})};
$("all").onchange=function(){var c=$("all").checked;selected.clear();if(c)entries.forEach(function(e){selected.add(e.n)});render();$("all").checked=c};
$("up").onclick=function(){var p=path.split("/").filter(Boolean);p.pop();location.hash="#"+encodeURIComponent("/"+p.join("/"))};
$("refresh").onclick=load;$("filter").oninput=render;
document.querySelectorAll("th[data-sort]").forEach(function(th){th.onclick=function(){var k=th.getAttribute("data-sort");if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true}render()}});
$("upload").onclick=function(){$("files").click()};
$("files").onchange=function(){uploadAll(Array.from($("files").files));$("files").value=""};
function uploadAll(files){var dir=path;files.reduce(function(pr,f){return pr.then(function(){return uploadOne(dir,f,false)})},Promise.resolve()).then(load)}
function uploadOne(dir,file,overwrite){
  return new Promise(function(resolve){
    var box=document.createElement("div");box.className="up";box.textContent=file.name;var bar=document.createElement("div");bar.className="p";bar.innerHTML="<div></div>";box.appendChild(bar);$("uploads").appendChild(box);
    var x=new XMLHttpRequest();x.open("PUT","/api/up?"+q(overwrite?{p:dir,n:file.name,o:1}:{p:dir,n:file.name}));x.setRequestHeader("X-OM-Key",key);
    x.upload.onprogress=function(e){if(e.lengthComputable)bar.firstChild.style.width=(100*e.loaded/e.total)+"%"};
    x.onload=function(){
      if(x.status===409&&!overwrite){box.remove();if(confirm(file.name+"\n"+T.exists)){uploadOne(dir,file,true).then(resolve)}else resolve();return}
      if(x.status>=200&&x.status<300){box.classList.add("done");bar.firstChild.style.width="100%";setTimeout(function(){box.remove()},2500)}else{box.classList.add("err");box.firstChild.textContent=file.name+" — "+T.failed+x.status}
      resolve()};
    x.onerror=function(){box.classList.add("err");resolve()};
    x.send(file);
  });
}
var depth=0;
window.addEventListener("dragenter",function(e){e.preventDefault();depth++;$("drop").style.display="flex"});
window.addEventListener("dragleave",function(){if(--depth<=0){depth=0;$("drop").style.display="none"}});
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("drop",function(e){e.preventDefault();depth=0;$("drop").style.display="none";var fs=Array.from(e.dataTransfer.files||[]);if(fs.length)uploadAll(fs)});
window.addEventListener("hashchange",function(){path=decodeURIComponent((location.hash||"#/").slice(1))||"/";load()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("pclose").click()});
load();
})();
</script>
</body>
</html>
