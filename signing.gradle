android {
    signingConfigs {
        def defaultStoreFile = rootProject.file('keystore/openmanager.jks')
        def defaultStorePassword = 'openmanager'
        def defaultKeyAlias = 'openmanager'
        def defaultKeyPassword = 'openmanager'

        release {
            def properties
            def propertiesFile = rootProject.file('signing.properties')
            if (propertiesFile.exists()) {
                properties = new Properties()
                properties.load(propertiesFile.newDataInputStream())
            }
            def getString = { String propertyName, String environmentName ->
                return properties?.get(propertyName) ?: System.getenv(environmentName)
            }

            def storeFilePath = getString('storeFile', 'STORE_FILE')
            if (storeFilePath && rootProject.file(storeFilePath).exists()) {
                storeFile rootProject.file(storeFilePath)
                storePassword getString('storePassword', 'STORE_PASSWORD')
                keyAlias getString('keyAlias', 'KEY_ALIAS')
                keyPassword getString('keyPassword', 'KEY_PASSWORD')
            } else if (defaultStoreFile.exists()) {
                storeFile defaultStoreFile
                storePassword defaultStorePassword
                keyAlias defaultKeyAlias
                keyPassword defaultKeyPassword
            }
        }

        debug {
            // Share the same permanent project key for debug so installs/updates never conflict
            if (defaultStoreFile.exists()) {
                storeFile defaultStoreFile
                storePassword defaultStorePassword
                keyAlias defaultKeyAlias
                keyPassword defaultKeyPassword
            }
        }
    }
}
