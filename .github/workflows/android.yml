name: OpenManager CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure Signing Keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Custom secret release keystore decoded"
        elif [ -f "keystore/openmanager.jks" ]; then
          echo "Using permanent project keystore (keystore/openmanager.jks)"
        fi

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Build Debug & Release APKs
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: OpenManager-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 10

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: OpenManager-release.apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 10

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 5

  emulator-test:
    name: Android Emulator Verification & Multi-Screen Capture
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: OpenManager-debug.apk
        path: apk-to-test/

    - name: Grant execute permission for test scripts
      run: chmod +x tools/emulator-smoke-test.sh

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Ensure Android SDK permissions
      run: |
        sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
        sudo chmod -R u+rwX "$ANDROID_HOME" 2>/dev/null || true
        rm -rf "$ANDROID_HOME/.downloadIntermediates" 2>/dev/null || true

    - name: Run Verification & Screenshots on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
        script: ./tools/emulator-smoke-test.sh

    - name: Upload Multi-Section Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openmanager-screenshots
        path: screenshots/
        retention-days: 10

    - name: Upload Performance Report & Logcat
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-performance-and-logs
        path: |
          emulator-performance.txt
          emulator-logcat.log
        retention-days: 10
