name: Remote Terminal E2E (SSH / Telnet)

on:
  workflow_dispatch:
  push:
    branches: [ 'feature/**' ]

concurrency:
  group: remote-terminal-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew testDebugUnitTest --stacktrace
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: remote-terminal-unit-tests
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 5

  e2e:
    name: SSH & Telnet against real servers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        mkdir -p apk-to-test && cp app/build/outputs/apk/debug/app-debug.apk apk-to-test/

    - name: Start test OpenSSH (2222) and Telnet (2323) servers
      run: |
        set -x
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server busybox tmux htop telnet ffmpeg
        sudo useradd -m -s /bin/bash omtest
        echo 'omtest:omtest-Pass1' | sudo chpasswd
        # Like a stock Ubuntu account: colored prompt that also sets the terminal title.
        printf '%s\n' \
          'PS1="\[\e]0;\u@\h: \w\a\]\[\e[01;32m\]\u@\h\[\e[00m\]:\[\e[01;34m\]\w\[\e[00m\]\$ "' \
          | sudo tee /home/omtest/.bashrc >/dev/null
        echo '[ -f ~/.bashrc ] && . ~/.bashrc' | sudo tee /home/omtest/.profile >/dev/null
        sudo chown omtest:omtest /home/omtest/.bashrc /home/omtest/.profile
        sudo mkdir -p /tmp/sshd_om /run/sshd
        sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/sshd_om/ssh_host_ed25519_key
        sudo tee /tmp/sshd_om/sshd_config >/dev/null <<'EOF'
        Port 2222
        ListenAddress 0.0.0.0
        HostKey /tmp/sshd_om/ssh_host_ed25519_key
        PidFile /tmp/sshd_om/sshd.pid
        PasswordAuthentication yes
        KbdInteractiveAuthentication yes
        UsePAM yes
        AllowUsers omtest
        PrintMotd no
        Subsystem sftp internal-sftp
        EOF
        sudo /usr/sbin/sshd -t -f /tmp/sshd_om/sshd_config
        sudo /usr/sbin/sshd -f /tmp/sshd_om/sshd_config -E /tmp/sshd_om.log
        if busybox --list | grep -qx telnetd; then
          sudo busybox telnetd -p 2323 -l /bin/login
        else
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq inetutils-telnetd socat
          TELNETD=$(ls /usr/sbin/in.telnetd /usr/sbin/telnetd /usr/libexec/inetutils/telnetd 2>/dev/null | head -n 1)
          echo "telnetd: $TELNETD"
          # inetd-style: each connection execs telnetd with the socket as stdin/stdout.
          sudo nohup socat TCP-LISTEN:2323,reuseaddr,fork EXEC:"$TELNETD",nofork >/tmp/telnetd_om.log 2>&1 &
        fi
        sleep 1
        sleep 1
        ss -ltnp | grep -E ':2222|:2323'
        # Sanity check from the runner itself: the login prompt must appear.
        (sleep 3) | timeout 5 telnet 127.0.0.1 2323 | head -n 20 || true

    - name: Generate test videos (4K H.264, 1080p HEVC)
      run: |
        ffmpeg -loglevel error -f lavfi -i testsrc2=size=3840x2160:rate=30 -f lavfi -i sine=frequency=440 \
          -t 20 -c:v libx264 -preset veryfast -profile:v high -pix_fmt yuv420p -c:a aac -shortest /tmp/om_4k_h264.mp4
        ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440 \
          -t 20 -c:v libx265 -preset veryfast -tag:v hvc1 -pix_fmt yuv420p -c:a aac -shortest /tmp/om_1080p_hevc.mp4
        ls -la /tmp/om_*.mp4

    - name: Generate test photos (12 MP with EXIF rotation, 720p)
      run: |
        ffmpeg -loglevel error -f lavfi -i testsrc2=size=4000x3000:rate=1 -frames:v 1 -q:v 4 /tmp/om_photo_raw.jpg
        ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=1 -frames:v 1 -q:v 4 /tmp/om_photo_small.jpg
        # Camera-style photo: landscape pixels with EXIF Orientation = 6 (show rotated 90°).
        python3 - <<'PY'
        import struct
        d = open('/tmp/om_photo_raw.jpg', 'rb').read()
        assert d[:2] == b'\xff\xd8'
        tiff = b'MM\x00\x2a' + struct.pack('>I', 8) + struct.pack('>H', 1) \
            + struct.pack('>HHIHH', 0x0112, 3, 1, 6, 0) + struct.pack('>I', 0)
        app1 = b'Exif\x00\x00' + tiff
        open('/tmp/om_photo_12mp.jpg', 'wb').write(d[:2] + b'\xff\xe1' + struct.pack('>H', len(app1) + 2) + app1 + d[2:])
        PY
        ls -la /tmp/om_photo_*.jpg

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run E2E on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
        script: bash tools/remote-terminal-e2e.sh

    - name: Upload E2E Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: remote-terminal-e2e
        path: remote-e2e/
        retention-days: 7

  update-e2e:
    name: Self-update from an older release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
    - name: Build this branch as an older version
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -PomVersionCode=100 -PomVersionName=2.0.0 --stacktrace
        mkdir -p apk-to-test && cp app/build/outputs/apk/debug/app-debug.apk apk-to-test/old.apk
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Update on Emulator
      env:
        GH_TOKEN: ${{ github.token }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
        script: bash tools/update-e2e.sh
    - name: Upload Update Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: update-e2e
        path: update-e2e/
        retention-days: 7
