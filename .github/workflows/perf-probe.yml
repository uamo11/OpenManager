name: Ultra RAM Perf Probe

on:
  workflow_dispatch:
  push:
    branches: [ 'perf/**' ]

concurrency:
  group: perf-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew testDebugUnitTest --stacktrace
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: perf-probe-unit-tests
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 5

  probe:
    name: Build Debug & Profile Memory per Screen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        mkdir -p apk-to-test && cp app/build/outputs/apk/debug/app-debug.apk apk-to-test/

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Profile on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
        script: bash tools/perf-probe.sh

    - name: Upload Probe Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: perf-probe
        path: perf-probe/
        retention-days: 7
